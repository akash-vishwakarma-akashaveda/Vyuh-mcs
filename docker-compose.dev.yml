version: "3.9"
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: vyuh-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports: ["9092:9092"]

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: vyuh-schema-registry
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports: ["8081:8081"]
    depends_on: [kafka]

  redis:
    image: redis:7.2-alpine
    container_name: vyuh-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports: ["6379:6379"]

  postgres:
    image: postgres:16-alpine
    container_name: vyuh-postgres
    environment:
      POSTGRES_USER: vyuh
      POSTGRES_PASSWORD: vyuh_dev_password
      POSTGRES_DB: vyuh_config
    ports: ["5432:5432"]
    volumes:
      - ./scripts/local/init-postgres.sh:/docker-entrypoint-initdb.d/init.sh

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: vyuh-timescaledb
    environment:
      POSTGRES_USER: vyuh
      POSTGRES_PASSWORD: vyuh_dev_password
      POSTGRES_DB: vyuh_telemetry
    ports: ["5433:5432"]

  etcd:
    image: quay.io/coreos/etcd:v3.5.13
    container_name: vyuh-etcd
    command: >
      etcd --name=local-etcd
      --initial-cluster-state=new
      --listen-client-urls=http://0.0.0.0:2379
      --advertise-client-urls=http://localhost:2379
    ports: ["2379:2379"]

  vault:
    image: hashicorp/vault:1.17
    container_name: vyuh-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]
    cap_add: [IPC_LOCK]
